[workspace]
members = [
    "apps/agent",
    "apps/desktop",
    "apps/linux-agent",
    "crates/capture",
    "crates/clipboard",
    "crates/crypto",
    "crates/file-transfer",
    "crates/input",
    "crates/protocol",
    "crates/transport",
    "crates/video",
    "servers/control",
    "servers/relay",
]
resolver = "3"

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zhangzllam/RemoteX"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = "0.8.9"
bincode = { version = "2.0.1", features = ["serde"] }
base64 = "0.22.1"
bytes = "1.10.1"
chacha20poly1305 = "0.10.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "zeroize"] }
hex = "0.4.3"
hmac = "0.12.1"
openh264 = "0.8.1"
portable-pty = "0.9.0"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.9.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rustls-pemfile = "2.2.0"
remotex-capture = { path = "crates/capture" }
remotex-clipboard = { path = "crates/clipboard" }
remotex-crypto = { path = "crates/crypto" }
remotex-file-transfer = { path = "crates/file-transfer" }
remotex-input = { path = "crates/input" }
remotex-protocol = { path = "crates/protocol" }
remotex-transport = { path = "crates/transport" }
remotex-video = { path = "crates/video" }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros"] }
subtle = "2.6.1"
sysinfo = "0.35.2"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
tower = "0.5.2"
tower-http = { version = "0.6.8", features = ["timeout"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
