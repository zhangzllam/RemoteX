[workspace]
members = [
    "apps/agent",
    "apps/desktop",
    "crates/capture",
    "crates/crypto",
    "crates/file-transfer",
    "crates/input",
    "crates/protocol",
    "crates/transport",
    "servers/control",
    "servers/relay",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zhangzllam/RemoteX"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
bytes = "1.10.1"
remotex-capture = { path = "crates/capture" }
remotex-crypto = { path = "crates/crypto" }
remotex-file-transfer = { path = "crates/file-transfer" }
remotex-input = { path = "crates/input" }
remotex-protocol = { path = "crates/protocol" }
remotex-transport = { path = "crates/transport" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
