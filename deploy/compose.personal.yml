# Additional IP-based entry point for the owner's RemoteX deployment.
# Apply together with compose.yml; the existing public services stay available.
services:
  control-ip:
    image: caddy:2.10-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile.personal:/etc/caddy/Caddyfile:ro
      - personal_caddy_data:/data
      - personal_caddy_config:/config
    networks:
      - edge
    ports:
      - "7443:7443/tcp"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  personal_caddy_data:
  personal_caddy_config:
